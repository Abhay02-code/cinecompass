# After creating your live account, optionally add ADMIN_USER_ID in the WEB SERVICE Environment.
services:
  - type: web
    name: cinecompass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TMDB_READ_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cinecompass-db
          property: connectionString
databases:
  - name: cinecompass-db
    databaseName: cinecompass
    user: cinecompass
