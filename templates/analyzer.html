<form id="analyze-form"><label for="review-input">Your English review</label><textarea id="review-input" rows="5" minlength="3" maxlength="5000" placeholder="The performances were wonderful, but the ending left me wanting more…" required></textarea><div class="form-bottom"><span class="muted small">Up to 5,000 characters</span>{% if current_user.is_authenticated %}<label class="checkbox"><input type="checkbox" id="save-analysis"> Save to my history</label>{% endif %}</div><button type="submit">Analyse review ↗</button><div id="analysis-result" role="status" aria-live="polite"></div><p class="fineprint">Binary English model. “Uncertain” means the score is near the decision boundary; it is not a neutral class. Estimates are not calibrated confidence.</p></form>
